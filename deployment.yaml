apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-demo
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: event-demo
  template:
    metadata:
      labels:
        app: event-demo
    spec:
      containers:
      - name: event-demo
        # Aligned to match your pipeline's image name so it pulls successfully
        image: naveen200612/html-demo:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: event-demo-service
spec:
  type: NodePort
  selector:
    app: event-demo
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30010
